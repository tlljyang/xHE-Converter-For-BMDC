[project]
name = "xhe4bmdc"
version = "0.1.0"
description = "xHE Converter for BMD Camera — batch-convert xHE-AAC (USAC) videos into editor-friendly formats (HandBrake-parity audio options)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "gradio>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xhe4bmdc = "xhe4bmdc.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xhe4bmdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
